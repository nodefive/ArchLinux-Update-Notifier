[package]
name = "arch-update-notifier"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Update checker daemon for Arch Linux (repo, AUR, Flatpak, Snap) with D-Bus interface"
license = "GPL-2.0-or-later"
publish = false

[lib]
name = "aun"
path = "src/lib.rs"

[[bin]]
name = "arch-update-notifier"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
gio = "0.22.11"
tokio = { version = "1.54.1", default-features = false, features = ["rt", "time", "process", "signal", "macros", "sync"] }
zbus = { version = "6.3.0", default-features = false, features = ["tokio", "service", "proxy"] }
# rustls with the ring provider: no OpenSSL, and lighter to build than aws-lc-rs.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
notify-rust = { version = "4.19.0", default-features = false, features = ["z-with-tokio"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "fmt", "std", "ansi"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = "symbols"
